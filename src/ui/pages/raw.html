<div class="page-raw">
    <header>
        <h1>Raw Data Inspector</h1>
        <p class="lead">Inspect all pre-aggregated counter rows directly from the nDB store.</p>
    </header>

    <section class="filter-bar">
        <nui-select id="raw-site-select" placeholder="Site">
            <select>
                <option value="">All sites</option>
            </select>
        </nui-select>
        <nui-date-range id="raw-range-picker">
            <nui-select placeholder="Range">
                <select>
                    <option value="" selected>Custom</option>
                    <option value="today">Today</option>
                    <option value="yesterday">Yesterday</option>
                    <option value="7d">Last 7 days</option>
                    <option value="30d">Last 30 days</option>
                    <option value="all">All time</option>
                </select>
            </nui-select>
            <input type="date" data-nui-date-range="from" aria-label="From date">
            <input type="date" data-nui-date-range="to" aria-label="To date">
        </nui-date-range>
        <nui-input clearable>
            <input type="search" id="raw-search" placeholder="Filter by path, referrer, country, browser...">
        </nui-input>
        <nui-select id="raw-limit">
            <select>
                <option value="50">50 rows</option>
                <option value="100" selected>100 rows</option>
                <option value="250">250 rows</option>
                <option value="all">All rows</option>
            </select>
        </nui-select>
        <nui-button id="raw-refresh-btn">
            <button type="button">
                <nui-icon name="refresh" decorative></nui-icon>
                Refresh
            </button>
        </nui-button>
    </section>

    <section>
        <p class="range-note" id="raw-stats">Loading rows…</p>

        <nui-table id="raw-table">
            <table>
                <thead>
                    <tr>
                        <th>Date &amp; Time (UTC)</th>
                        <th>Site</th>
                        <th>Path</th>
                        <th>Referrer</th>
                        <th>Country</th>
                        <th>Device</th>
                        <th>Browser</th>
                        <th class="num">Hits</th>
                    </tr>
                </thead>
                <tbody id="raw-tbody">
                    <!-- populated via JS -->
                </tbody>
            </table>
        </nui-table>
        <p id="raw-empty" class="lead" hidden>No matching counter rows found.</p>
    </section>
</div>
