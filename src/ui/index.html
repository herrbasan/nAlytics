<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <title>nAlytics</title>
    <!-- NUI core (served from the nui_wc2 submodule) -->
    <link rel="stylesheet" href="/analytics/nui/css/nui-theme.css">
    <!-- App CSS -->
    <link rel="stylesheet" href="/analytics/app/css/main.css">
    <style>
        /* Prevent layout shifts by hiding app until upgraded and ready */
        body { margin: 0; padding: 0; overflow: hidden; }
        nui-app:not(.nui-ready) { display: none; }
    </style>
    <!-- Main App Logic -->
    <script type="module" src="/analytics/app/js/app.js"></script>
</head>
<body>
    <nui-app content-width="60rem" content-min-width="50rem">
        <nui-skip-links></nui-skip-links>

        <nui-app-header>
            <header>
                <div slot="left">
                    <nui-button data-action="toggle-sidebar" variant="icon">
                        <button type="button" aria-label="Toggle navigation">
                            <nui-icon name="menu" decorative></nui-icon>
                        </button>
                    </nui-button>
                    <h1>nAlytics</h1>
                </div>
                <div slot="right">
                    <nui-button data-action="toggle-theme" variant="icon">
                        <button type="button" aria-label="Toggle theme">
                            <nui-icon name="brightness" decorative></nui-icon>
                        </button>
                    </nui-button>
                </div>
            </header>
        </nui-app-header>

        <nui-sidebar behavior="primary" id="nav-sidebar">
            <nui-link-list mode="fold" id="main-navigation">
                <!-- Loaded via JS -->
            </nui-link-list>
        </nui-sidebar>

        <nui-content>
            <nui-main>
                <!-- Dynamic pages loaded here via the router -->
            </nui-main>
        </nui-content>
    </nui-app>
</body>
</html>
