<div class="page-raw">
    <header style="margin-bottom: var(--nui-space-double)">
        <h1>Raw Data Inspector</h1>
        <p class="lead">Inspect all pre-aggregated counter rows directly from the nDB store.</p>
    </header>

    <section>
        <div style="display: flex; gap: var(--nui-space); align-items: center; flex-wrap: wrap;">
            <nui-select id="raw-site-select" placeholder="Site">
                <select>
                    <option value="">All sites</option>
                </select>
            </nui-select>
            <div style="flex: 1; min-width: 14rem;">
                <nui-input clearable>
                    <input type="search" id="raw-search" placeholder="Filter by path, referrer, country, browser...">
                </nui-input>
            </div>
            <nui-select id="raw-limit">
                <select>
                    <option value="50">50 rows</option>
                    <option value="100" selected>100 rows</option>
                    <option value="250">250 rows</option>
                    <option value="all">All rows</option>
                </select>
            </nui-select>
            <nui-button id="raw-refresh-btn">
                <nui-icon name="refresh" decorative></nui-icon>
                <button type="button">Refresh</button>
            </nui-button>
        </div>
    </section>

    <section style="margin-top: var(--nui-space-double)">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--nui-space);">
            <div id="raw-stats" style="color: var(--color-text-dim); font-size: var(--font-size-small);">
                Loading rows…
            </div>
        </div>

        <nui-table id="raw-table">
            <table>
                <thead>
                    <tr>
                        <th>Date & Time (UTC)</th>
                        <th>Site</th>
                        <th>Path</th>
                        <th>Referrer</th>
                        <th>Country</th>
                        <th>Device</th>
                        <th>Browser</th>
                        <th style="text-align: right;">Hits</th>
                    </tr>
                </thead>
                <tbody id="raw-tbody">
                    <!-- populated via JS -->
                </tbody>
            </table>
        </nui-table>
        <p id="raw-empty" class="lead" hidden style="margin-top: var(--nui-space);">No matching counter rows found.</p>
    </section>
</div>
